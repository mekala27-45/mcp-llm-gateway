name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make bench-quick
