[project]
name = "mcp-llm-gateway"
version = "1.0.0"
description = "An MCP server, an MCP security gateway, and an LLM gateway with streaming PII redaction, token rate limits and failover."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "customer-server",
    "gateway-common",
    "mock-downstream",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
customer-server = { workspace = true }
gateway-common = { workspace = true }
mock-downstream = { workspace = true }

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["customer_server", "gateway_common", "mock_downstream"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["packages/customer_server/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = ["customer_server", "gateway_common", "mock_downstream"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
